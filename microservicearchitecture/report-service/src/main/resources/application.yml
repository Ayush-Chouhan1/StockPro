server:
  port: 8089

spring:
  application:
    name: REPORT-SERVICE

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/stockpro_report_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mvc:
    pathmatch:
      use-suffix-pattern: false

# Dead stock threshold (days)
report:
  dead-stock-days: 90
  slow-moving-days: 30

# URLs of other services
services:
  warehouse-url: ${WAREHOUSE_SERVICE_URL:http://warehouse-service:8084}
  purchase-url: ${PURCHASE_SERVICE_URL:http://purchase-service:8086}
  movement-url: ${MOVEMENT_SERVICE_URL:http://movement-service:8087}
  product-url: ${PRODUCT_SERVICE_URL:http://product-service:8083}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:report-service}

logging:
  level:
    com.stockpro: DEBUG
  file:
    name: logs/report-service.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
